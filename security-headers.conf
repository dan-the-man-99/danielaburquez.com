# Security response headers. `always` = send them on error pages (404, 500) too.

# Content-Security-Policy: the browser may only load resources from our own
# origin. If an attacker ever injected a <script src="evil.com">, the browser
# would refuse it. No 'unsafe-inline' needed, because the site has no inline
# scripts or styles (see inlineStylesheets in astro.config.mjs).
#   object-src 'none'     no Flash/plugins
#   base-uri 'none'       blocks <base> tag hijacking of relative URLs
#   form-action 'none'    the site has no forms (contact is a mailto: link)
#   frame-ancestors 'none' nobody may embed this site in an iframe (anti-clickjacking)
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# HSTS: "only ever talk to me over HTTPS" (browsers remember this for a year).
# Cloudflare terminates TLS in front of us; browsers ignore this header on plain
# HTTP, so it only takes effect on the public HTTPS site. Deliberately NO
# includeSubDomains / preload yet: those are hard to undo and could affect
# your other subdomains.
add_header Strict-Transport-Security "max-age=31536000" always;

# Stop browsers "guessing" a file's type (e.g. running a .txt as a script).
add_header X-Content-Type-Options "nosniff" always;

# Older browsers don't understand frame-ancestors, so also send this.
add_header X-Frame-Options "DENY" always;

# Send only the origin (not the full URL path) to other sites when a link is clicked.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Switch off browser features the site never uses.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Isolate this site from other windows/origins (blocks a class of cross-site leaks).
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
