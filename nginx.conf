# Full nginx config for a read-only, non-root container.
# Everything nginx must WRITE (pid file, temp buffers, logs) lives under /tmp,
# which we mount as a small in-memory tmpfs. The rest of the filesystem stays
# read-only, so a compromised process can't plant or modify files.

worker_processes auto;
pid /tmp/nginx.pid;

# Log to stdout/stderr: the container platform collects them (Loki, later).
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout;

  # Default temp paths are under /var/cache/nginx, which is read-only here.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Don't advertise the nginx version in headers and error pages.
  server_tokens off;

  sendfile on;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GOTCHA: nginx's add_header is NOT inherited into a location block that
    # has its own add_header. So the security headers live in one file that we
    # include at the server level AND inside every location that adds headers.
    include /etc/nginx/security-headers.conf;

    # Used by Docker/Kubernetes probes. Not logged, so probes don't flood logs.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Astro fingerprints these filenames (a hash of the content), so a given
    # URL never changes: safe to cache for a year.
    location /_astro/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Clean URLs: /how-this-site-works -> /how-this-site-works/index.html
    location / {
      try_files $uri $uri/index.html =404;
    }
  }
}
